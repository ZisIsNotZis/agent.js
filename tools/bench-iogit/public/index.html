<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>isomorphic-git over OPFS — timing</title>
<script type="module">
  // Buffer shim first: isomorphic-git 1.44.4 throws "Missing Buffer
  // dependency" from StreamReader without a global Buffer, and its ESM build
  // imports no shim of its own.
  import { Buffer } from './vendor/buffer.min.js'
  globalThis.Buffer = globalThis.Buffer ?? Buffer
</script>
</head>
<body>
<pre id="out">loading…</pre>
<script type="module">
  const out = document.getElementById('out')
  window.__ready = false
  try {
    await import('./bench.js')
    window.__ready = true
    out.textContent = 'ready'
  } catch (e) {
    out.textContent = 'boot error: ' + (e && e.stack || e)
    window.__bootError = String(e && e.stack || e)
  }
</script>
</body>
</html>
